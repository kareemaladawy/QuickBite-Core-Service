services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: quickbite_core_test
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d quickbite_core_test" ]
      interval: 10s
      retries: 5
      timeout: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
      timeout: 30s

  # testing container
  test:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: root
      DB_NAME: quickbite_core_test
      DB_POOL_MAX: 10
      DB_MIGRATIONS_DIR: src/migrations
      DB_MIGRATIONS_EXTENTION: ts
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ACCESS_SECRET: test-access-secret
      REFRESH_SECRET: test-refresh-secret
      ACCESS_EXPIRES_IN: 3600
      REFRESH_EXPIRES_IN: 60480
      ACCESS_EXPIRES_IN_MS: 3600000
      MAILJET_FROM_NAME: test
      MAILJET_FROM_EMAIL: test@test.com
      MAILJET_API_KEY: test
      MAILJET_API_SECRET: test
      INTERNAL_API_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -e -c "npm ci && npm run build && npm run test && npm run test:integration"
